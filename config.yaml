training:
  batch_size: 64
  epochs: 3
  lr: 0.1   # {SGD: 0.1, Adam: 0.001}
  optim_name: SGD   # SGD or Adam
  model_name: eenet34_51015_quarter   # eenet20_half, eenet34_1525_quarter, eenet34_51015_quarter
  dataset_name: CIFAR10   # [MNIST, CIFAR10, CIFAR100]
  batch_speedup: 2
  flops_per_cycle: 5
  temperature: 3

FL:
  global_rounds: 3
  num_clients: 40
  dirichlet: 0.5   # [0.1, 1e20]
  ite_num: 3
  cohort: 1

communication:
  total_bandwidth: 5000000  # 5 MHz
  power_dbm: 23.0  # dbm
  TXG: 0       # デバイス側のアンテナ利得[dBi]
  RXG: 15      # 基地局側のアンテナ利得[dBi]
  N_psd: -174  # 雑音電力スペクトル密度[dBm/Hh]
  NF: 5        # 雑音指数[dB]
  max_dis: 500
  min_dis: 35